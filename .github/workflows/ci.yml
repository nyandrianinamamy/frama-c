# Build, checks and tests of the OCaml analyzer.
# The Lean model has its own workflow (lean-model.yml).
# The switch follows docs/agents/setup.md: OCaml 5.2.1 and Dune 3.21.1.

name: CI

on:
  push:
    branches:
      - dev
      - master
      - "spec/**"
      - "ci/**"
    paths-ignore:
      - "lean/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "lean/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DUNE_CACHE: disabled
  TERM: xterm
  JOBS: 4
  OPAMSWITCH: ci
  OPAMYES: "true"
  # Change this value to rebuild the opam switch from scratch.
  OPAM_CACHE_VERSION: ocaml5.2.1-dune3.21.1-v1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Checks and Eva tests
            scope: eva
          - name: Eva domain tests
            scope: eva-domains
          - name: Kernel tests and default ptests
            scope: kernel
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # APT resolves and authenticates the packages on the first run for each
      # runner image. Keep the archives so subsequent jobs can install locally.
      - name: Identify system packages
        id: packages
        run: |
          cat > "$RUNNER_TEMP/ci-packages" <<'PACKAGES'
          build-essential autoconf m4 pkg-config git curl unzip patch libgmp-dev
          libmpfr-dev zlib1g-dev graphviz time clang yq socat dos2unix libzmq3-dev
          python3-venv jq opam gcc-multilib
          PACKAGES
          digest=$(sha256sum "$RUNNER_TEMP/ci-packages" | cut -d' ' -f1)
          echo "key=apt-v1-$ImageOS-$ImageVersion-$RUNNER_ARCH-$digest" >> "$GITHUB_OUTPUT"

      - name: Restore system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-debs/*.deb
          key: ${{ steps.packages.outputs.key }}

      - name: Install system packages
        run: |
          if [[ "${{ steps.apt-cache.outputs.cache-hit }}" != true ]]; then
            sudo apt-get update
            mkdir -p "$RUNNER_TEMP/ci-debs"
            xargs -a "$RUNNER_TEMP/ci-packages" sudo apt-get install \
              -o Dir::Cache::archives="$RUNNER_TEMP/ci-debs" \
              --download-only -y --no-install-recommends
          fi
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/ci-debs/*.deb)
          xargs -a "$RUNNER_TEMP/ci-packages" sudo apt-get install \
            --no-install-recommends -y "${archives[@]}"

      - name: Save system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-debs/*.deb
          key: ${{ steps.packages.outputs.key }}

      # The switch takes about half an hour to build. It is saved as soon as
      # it is complete, so that a failing test does not lose it, and reused
      # until the opam file or OPAM_CACHE_VERSION changes.
      - name: Restore the opam switch
        id: opam-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-${{ env.OPAM_CACHE_VERSION }}-${{ hashFiles('opam') }}

      - name: Create the opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing --no-setup -y
          opam switch create ci ocaml-base-compiler.5.2.1 -y --jobs=$JOBS
          opam install dune.3.21.1 -y --jobs=$JOBS
          opam pin add dune 3.21.1 --no-action -y
          opam install --deps-only --with-test . -y --jobs=$JOBS
          opam install -y --jobs=$JOBS apron zmq ocp-indent.1.10.0 headache \
            camomile
          opam clean --download-cache --logs --repo-cache --switch-cleanup -y

      - name: Save the opam switch
        if: steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Install Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install check-jsonschema==0.39.0 \
            PyYAML==6.0.3 black==26.10.1 clang-format==21.1.8
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check the toolchain versions
        run: opam exec -- bash dev/check-env.sh

      # Dune's shared cache is used for the build only. The tests run without
      # it, so that each result comes from an execution in this run.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ env.OPAM_CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            dune-${{ runner.os }}-${{ env.OPAM_CACHE_VERSION }}-

      - name: Build
        env:
          DUNE_CACHE: enabled
        run: opam exec -- dune build -j $JOBS @install

      - name: Save the build cache
        if: matrix.scope == 'eva' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ env.OPAM_CACHE_VERSION }}-${{ github.sha }}

      - name: Check that Eva and its Apron domains are built
        run: |
          opam exec -- dune exec --no-build -- frama-c -plugins > plugins.txt
          grep -q '^Eva ' plugins.txt
          test -d _build/install/default/lib/frama-c-eva/apron

      - name: Lint
        if: matrix.scope == 'eva'
        run: opam exec -- make check-lint LINTCK_EXTRA=-s

      - name: License headers
        if: matrix.scope == 'eva'
        run: opam exec -- make check-headers

      - name: Eva ptests
        if: matrix.scope != 'kernel'
        run: |
          opam exec -- dune exec -- frama-c-ptests -never-disabled plugins/eva/tests
          # Divide the generated aliases between runners. New domain
          # configurations automatically join the first group.
          targets=()
          for rules in plugins/eva/tests/*/result*/dune; do
            group=eva
            case "$rules" in
              */result_apron/*|*/result_gauges/*|*/result_octagon/*|*/result_symblocs/*)
                group=eva-domains ;;
            esac
            if [[ "$group" == "${{ matrix.scope }}" ]]; then
              targets+=("@${rules%/dune}/ptests")
            fi
          done
          (( ${#targets[@]} > 0 ))
          printf '%s\n' "${targets[@]}"
          opam exec -- dune build -j $JOBS "${targets[@]}"

      - name: Eva native tests
        if: matrix.scope == 'eva'
        run: opam exec -- dune runtest -j $JOBS plugins/eva

      - name: Default ptests of the kernel and the plug-ins
        if: matrix.scope == 'kernel'
        run: |
          opam exec -- make run-ptests PTEST_OPTS="-config DEFAULT"
          opam exec -- dune build -j $JOBS @ptests_config

      - name: Kernel native tests
        if: matrix.scope == 'kernel'
        run: opam exec -- dune runtest -j $JOBS tests
