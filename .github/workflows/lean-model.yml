# Proof build of the Lean model in lean/ (see lean/README.md).
# It runs when a file of the model, its toolchain pin or this workflow
# changes. Other changes do not start it.

name: Lean model

on:
  push:
    # Without a branch filter, a pushed tag starts the job whatever it changes.
    branches:
      - "**"
    paths:
      - "lean/**"
      - ".github/workflows/lean-model.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/lean-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan 4.2.4
        env:
          ELAN_URL: https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tar.gz" "$ELAN_URL"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the model and check the axioms of its theorems
        working-directory: lean
        run: lake build --wfail
